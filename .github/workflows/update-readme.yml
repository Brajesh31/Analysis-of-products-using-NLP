name: Refresh README timestamp

on:
  workflow_dispatch:
  schedule:
    # A weekly timestamp refresh avoids creating noisy commits every hour.
    - cron: "17 5 * * 1"

permissions:
  contents: write

concurrency:
  group: readme-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh repository timestamp
    runs-on: ubuntu-latest
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Update timestamp
        shell: bash
        run: |
          set -euo pipefail
          timestamp="Last updated: $(date -u +'%Y-%m-%d %H:%M UTC')"

          if grep -q '^Last updated:' README.md; then
            sed -i "s/^Last updated:.*/$timestamp/" README.md
          else
            printf '\n%s\n' "$timestamp" >> README.md
          fi

      - name: Commit only when content changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md

          if git diff --cached --quiet; then
            echo "README timestamp is already current."
            exit 0
          fi

          git commit -m "chore: refresh README timestamp"
          git push origin HEAD:main
